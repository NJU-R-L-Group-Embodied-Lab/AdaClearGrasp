# ========== OpenAI / VLM ==========
openai:
  api_key: 
  base_url: "https://api.siliconflow.cn/v1"
  model: "Qwen/Qwen3-VL-32B-Instruct"
  temperature: 0.7
  max_tokens: 256
  image_detail: "high"

# ========== MCP server ==========
mcp:
  command: "python"
  server_script: "exec/mcp_server.py"

# ========== Planning ==========
plan:
  max_steps: 40
